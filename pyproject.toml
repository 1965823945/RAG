[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-minimal"
version = "0.3.0"
description = "A modular, extensible RAG system with multi-tool invocation, planning agent, and memory system"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "RAG Team"}
]
keywords = [
    "rag",
    "retrieval-augmented-generation",
    "langchain",
    "llm",
    "agent",
    "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-chroma>=0.1.0",
    "chromadb>=0.5.0",
    "pypdf>=4.0.0",
    "python-docx>=1.0.0",
    "docx2txt>=0.8",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.3.0"]
anthropic = ["langchain-anthropic>=0.3.0"]
ollama = ["langchain-ollama>=0.3.0"]
web = ["streamlit>=1.40.0"]
pdf = ["reportlab>=4.0.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "mypy>=1.0.0",
]
all = [
    "rag-minimal[openai,anthropic,ollama,web,pdf,dev]",
]

[project.urls]
Homepage = "https://github.com/1965823945/RAG"
Repository = "https://github.com/1965823945/RAG"
Issues = "https://github.com/1965823945/RAG/issues"

[project.scripts]
rag-minimal = "rag_minimal.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rag_minimal*"]

[tool.setuptools.package-data]
rag_minimal = ["py.typed"]

# ─────────────────────────────────────────────────────────────
# Pytest Configuration
# ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["rag_minimal/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

# ─────────────────────────────────────────────────────────────
# Ruff Configuration
# ─────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    "chroma_db",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B904",   # raise without from inside except
]

[tool.ruff.lint.isort]
known-first-party = ["rag_minimal"]

# ─────────────────────────────────────────────────────────────
# MyPy Configuration
# ─────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "tests/",
    "build/",
    "dist/",
]

# ─────────────────────────────────────────────────────────────
# Coverage Configuration
# ─────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["rag_minimal"]
omit = [
    "rag_minimal/tests/*",
    "rag_minimal/generate_samples.py",
    "rag_minimal/app.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
