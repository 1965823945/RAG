name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f WorkSpace/RAG/private_demo_domain/requirements.txt ]; then pip install -r WorkSpace/RAG/private_demo_domain/requirements.txt; fi
      - name: Run smoke test
        run: |
          python WorkSpace/RAG/private_demo_domain/validate_run.py
